# Configuration globale du système de monitoring CTI
# Paramètres partagés par tous les breakpoints

# ====== Logging ======
logging:
  # Répertoire de stockage des logs
  log_dir: ./logs
  
  # Niveau de log (DEBUG, INFO, WARNING, ERROR, CRITICAL)
  log_level: INFO
  
  # Rotation des logs (nombre de jours à conserver)
  retention_days: 30
  
  # Format des logs
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  date_format: "%Y-%m-%d %H:%M:%S"

# ====== Exécution ======
execution:
  # Mode d'exécution par défaut
  # - "single": exécute un seul breakpoint
  # - "all": exécute tous les breakpoints configurés
  mode: all
  
  # Breakpoint(s) à exécuter en mode "single" (liste d'IDs)
  target_breakpoints:
    - bp9_dwh_oracle
  
  # Patterns à exclure en mode "all" (fichiers de test/exemple)
  # Les breakpoints dont l'ID contient un de ces patterns seront ignorés
  exclude_patterns:
    - bp_test_
    - bp_example_
    - _example
    - _mock
  
  # Parallélisation (nombre de breakpoints exécutés en parallèle)
  # 1 = séquentiel, >1 = parallèle (à utiliser avec prudence si connexions limitées)
  max_workers: 1
  
  # Timeout par breakpoint (en secondes)
  timeout_seconds: 300

# ====== Notifications ======
notifications:
  # Activer/désactiver les notifications
  enabled: true
  
  # Types de notifications à envoyer
  # Valeurs possibles : email, push, webhook
  channels:
    - email
    - push
  
  # Configuration email (si activé)
  email:
    smtp_server: smtp.gmail.com
    smtp_port: 587
    sender: smrcorp007@gmail.com # ${EMAIL_SENDER}
    sender_password: rrxjhbckbdtzfqjv # ${EMAIL_SENDER_PASSWORD}
    recipients:
      alerts:
        - ralphseffi@gmail.com
      reports:
        - ralphseffi@gmail.com
      all:
        - ralphseffi@gmail.com
    
    # Envoyer seulement en cas d'échec ou toujours
    send_on_failure_only: true  # true = seulement si problème détecté
    
    # Rapport quotidien : envoi conditionnel
    send_daily_report: true
    daily_report_min_score: 10  # Envoyer si au moins un breakpoint a un score < 10
    # Valeurs possibles :
    # - 10 : Envoyer dès qu'il y a le moindre problème (recommandé)
    # - 8  : Envoyer seulement si score < 8 (warnings ou critiques)
    # - 5  : Envoyer seulement si score < 5 (critiques seulement)
    
    # Throttling (éviter spam)
    min_interval_between_alerts: 300  # 5 minutes entre alertes du même breakpoint
    max_emails_per_hour: 10           # Maximum 10 emails/heure
  
  # Configuration push/ntfy (si activé)
  push:
    url: https://ntfy.sh/
    topic: OCM_CTI_Monitoring
    priority_normal: default
    priority_critical: high

# ====== Dashboard / API ======
dashboard:
  # Activer l'export JSON pour le dashboard
  export_enabled: true
  
  # Répertoire d'export des résultats JSON (pour le frontend)
  export_dir: ./dashboard_data
  
  # Historique des runs conservé pour le dashboard (nombre de runs)
  history_size: 30

# ====== Seuils par défaut ======
# Ces valeurs sont utilisées si un breakpoint ne les définit pas explicitement
default_thresholds:
  # Volumétrie
  min_lines: 1000
  baseline_tolerance_percent: 20.0
  baseline_days: 14
  
  # Qualité
  duplicate_tolerance: 0
  max_null_rate_percent: 2.0
  
  # Distribution horaire
  hourly_tolerance_percent: 5.0
  
  # Score
  score_normal: 10
  score_degrade_min: 6
  score_critique_max: 5

# ====== Base de données SQLite (historisation) ======
database:
  # Activer la sauvegarde dans SQLite
  enabled: true
  
  # Chemin vers la base de données
  path: ./data/monitoring.db
  
  # Rétention des données (jours)
  retention_days: 365
  
  # Options SQLite
  auto_vacuum: true
  journal_mode: WAL

# ====== Export des outliers (CSV granulaire) ======
outliers:
  # Activer l'export CSV des outliers détectés
  export_csv: true
  
  # Répertoire de sortie
  output_dir: ./outliers
  
  # Rétention des fichiers CSV (jours)
  retention_days: 90

# ====== Base de données de métriques (optionnel, pour historisation avancée) ======
metrics_db:
  # Activer la sauvegarde des métriques dans une base dédiée
  enabled: false
  
  # Type de base (sqlite, postgresql)
  type: sqlite
  
  # Chemin ou DSN
  connection: ./logs/metrics.db
